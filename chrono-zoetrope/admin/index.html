<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CDB admin</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0d0d0f;
        color: #e8e6e3;
        font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
      }

      /* 좌측 persona 사이드바 + 우측 본문 2단 레이아웃 */
      .app {
        display: flex;
        align-items: flex-start;
      }
      #sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        width: 236px;
        flex: none;
        display: flex;
        flex-direction: column;
        background: rgba(255, 255, 255, 0.02);
        border-right: 1px solid rgba(255, 255, 255, 0.08);
      }
      .content {
        flex: 1;
        min-width: 0;
      }
      .side-head {
        padding: 16px 14px 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      }
      .side-head h1 {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.02em;
        margin-bottom: 12px;
      }
      #persona-search {
        width: 100%;
        background: #1a1a1e;
        color: #e8e6e3;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        padding: 7px 10px;
        font-size: 13px;
      }
      #persona-search::placeholder {
        color: rgba(255, 255, 255, 0.35);
      }
      .side-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
      }
      .pitem {
        display: flex;
        flex-direction: column;
        gap: 3px;
        width: 100%;
        text-align: left;
        padding: 9px 11px;
        margin-bottom: 2px;
        border-radius: 9px;
        border: 1px solid transparent;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      .pitem:hover {
        background: rgba(255, 255, 255, 0.045);
      }
      .pitem.active {
        background: rgba(255, 190, 80, 0.12);
        border-color: rgba(255, 190, 80, 0.35);
      }
      .pitem .pname {
        font-size: 13px;
        font-weight: 600;
        color: #e8e6e3;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pitem.active .pname {
        color: #ffc466;
      }
      .pitem .pmeta {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.45);
      }
      .side-empty {
        padding: 14px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.4);
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 22px;
        background: rgba(13, 13, 15, 0.92);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .cur-name {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .counts {
        font-size: 12.5px;
        color: rgba(255, 255, 255, 0.55);
      }
      .counts b {
        color: #e8e6e3;
      }
      .gender-ctl {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12.5px;
        color: rgba(255, 255, 255, 0.55);
      }
      .gender-ctl .gsrc {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.4);
      }

      /* 세션 참가자(연구자용 "로그인") — 이 참가자의 생애가 4창 런타임에 재생된다. */
      .session-ctl {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-left: auto;
        font-size: 12.5px;
      }
      .session-label {
        color: rgba(255, 255, 255, 0.55);
      }
      .session-label b {
        color: #7de08c;
      }
      #session-set,
      #session-set2 {
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        padding: 6px 13px;
        border-radius: 999px;
        border: 1px solid rgba(110, 220, 130, 0.5);
        background: transparent;
        color: #7de08c;
      }
      #session-set:hover {
        background: rgba(110, 220, 130, 0.14);
      }
      #session-set:disabled,
      #session-set2:disabled {
        opacity: 0.45;
        cursor: default;
      }
      /* 장면 뷰 탭바 — 분기 미래가 있으면 스크롤이 배로 길어지므로, 운명적/분기 섹션을 탭으로 전환한다. */
      .scene-tabs {
        display: flex;
        gap: 8px;
        margin: 14px 0 4px;
        position: sticky;
        top: 0;
        z-index: 5;
        background: #0d0d0f;
        padding: 8px 0;
      }
      .scene-tabs button {
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        padding: 7px 16px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: transparent;
        color: #aab;
      }
      .scene-tabs button.active {
        border-color: rgba(110, 220, 130, 0.6);
        color: #7de08c;
        background: rgba(110, 220, 130, 0.1);
      }
      .scene-tabs button.branch-tab.active {
        border-color: rgba(178, 140, 255, 0.6);
        color: #b98cff;
        background: rgba(178, 140, 255, 0.1);
      }
      /* 분기 미래(3차) 장면 섹션 — 2차 버튼과 같은 보라 계열로, 운명적 32장과 시각적으로 구분한다. */
      .stage.branch h2 {
        color: #b98cff;
        border-left: 3px solid rgba(178, 140, 255, 0.5);
        padding-left: 8px;
      }
      /* 2차 체험(분기 미래) — 다른 삶의 색(보라)으로 1차와 시각적으로 구분한다. */
      #session-set2 {
        border-color: rgba(178, 140, 255, 0.5);
        color: #b98cff;
      }
      #session-set2:hover {
        background: rgba(178, 140, 255, 0.14);
      }
      .regenall-ctl {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-left: 10px;
      }
      #regen-all {
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        padding: 6px 13px;
        border-radius: 999px;
        border: 1px solid rgba(255, 190, 80, 0.5);
        background: transparent;
        color: #ffc466;
      }
      #regen-all:hover {
        background: rgba(255, 190, 80, 0.14);
      }
      #regen-all:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .regenall-status {
        font-size: 12px;
        color: #ffc466;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .pitem .psession {
        color: #7de08c;
        font-weight: 600;
      }
      /* 리스트 항목 뱃지 — 로컬/클라우드 위치와 생성 상태를 한눈에. */
      .pitem .pbadge {
        font-size: 10px;
        margin-left: 6px;
        padding: 0 5px;
        border-radius: 4px;
        vertical-align: middle;
      }
      .pitem .pb-cloud {
        color: #8fc7ff;
        border: 1px solid rgba(143, 199, 255, 0.4);
      }
      .pitem .pb-pending {
        color: #ffd27d;
        border: 1px solid rgba(255, 210, 125, 0.4);
      }
      .pitem .pb-error {
        color: #ff9a9a;
        border: 1px solid rgba(255, 154, 154, 0.4);
      }
      .pitem.notready .pname {
        opacity: 0.65;
      }

      main {
        padding: 20px 22px 60px;
      }
      .stage {
        margin-bottom: 30px;
      }
      .stage h2 {
        font-size: 13px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.6);
        letter-spacing: 0.06em;
        margin-bottom: 10px;
      }
      .row {
        display: flex;
        gap: 14px;
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .card {
        background: #17171a;
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 12px;
        overflow: hidden;
        width: 340px;
        flex: none;
        transition: opacity 0.2s ease;
      }
      .card img {
        display: block;
        width: 100%;
        aspect-ratio: 1344 / 768;
        object-fit: cover;
        background: #000;
        cursor: zoom-in;
      }
      .card .meta {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 11px;
      }
      .card .meta .id {
        font-size: 12.5px;
        font-weight: 600;
      }
      .card .meta .sub {
        font-size: 11.5px;
        color: rgba(255, 255, 255, 0.45);
      }
      .badge {
        margin-left: auto;
        font-size: 11px;
        font-weight: 600;
        padding: 3px 8px;
        border-radius: 999px;
      }

      .actions {
        display: flex;
        gap: 6px;
        padding: 0 11px 11px;
      }
      .actions button {
        flex: 1;
        padding: 7px 0;
        font-size: 12.5px;
        font-weight: 600;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.13);
        background: transparent;
        color: rgba(255, 255, 255, 0.8);
        cursor: pointer;
      }
      .actions button:hover {
        border-color: rgba(255, 255, 255, 0.4);
      }
      .actions button:disabled {
        opacity: 0.4;
        cursor: default;
      }

      .card.failed {
        border-color: rgba(255, 110, 110, 0.4);
      }
      .card-failed {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        aspect-ratio: 1344 / 768;
        background: repeating-linear-gradient(
          45deg,
          rgba(255, 110, 110, 0.06),
          rgba(255, 110, 110, 0.06) 12px,
          transparent 12px,
          transparent 24px
        );
        color: rgba(255, 133, 133, 0.85);
        font-size: 12.5px;
        font-weight: 600;
      }

      .hidden {
        display: none;
      }
      #status {
        position: fixed;
        right: 18px;
        bottom: 14px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.5);
      }

      /* 생성 큐 (collector 제출 → 자동 생성) */
      #queue-panel {
        padding: 12px 22px;
        background: rgba(255, 255, 255, 0.025);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .qhead {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
      }
      .qhead h2 {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: rgba(255, 255, 255, 0.7);
      }
      .qhead .now {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.55);
      }
      .qhead .now b {
        color: #ffc466;
      }
      .qhead .now button {
        margin-left: 8px;
        font-size: 11.5px;
        font-weight: 600;
        cursor: pointer;
        padding: 3px 10px;
        border-radius: 999px;
        border: 1px solid rgba(255, 190, 80, 0.5);
        background: transparent;
        color: #ffc466;
      }
      .qhead .now button:hover {
        background: rgba(255, 190, 80, 0.16);
      }
      #auto-toggle {
        margin-left: auto;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        padding: 6px 13px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: transparent;
        color: rgba(255, 255, 255, 0.7);
      }
      #auto-toggle.on {
        background: rgba(110, 220, 130, 0.9);
        color: #0b0b0c;
        border-color: transparent;
      }
      #auto-toggle.off {
        background: rgba(255, 190, 80, 0.16);
        color: #ffc466;
      }
      .qlist {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .qitem {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        padding: 6px 10px;
        border-radius: 8px;
        background: #17171a;
        border: 1px solid rgba(255, 255, 255, 0.07);
      }
      .qitem .qid {
        color: rgba(255, 255, 255, 0.85);
        font-weight: 600;
      }
      .qitem .badge {
        margin-left: 0;
      }
      .badge.submitted {
        background: rgba(150, 170, 255, 0.16);
        color: #a9b8ff;
      }
      .badge.generating {
        background: rgba(255, 190, 80, 0.18);
        color: #ffc466;
      }
      .badge.done {
        background: rgba(110, 220, 130, 0.16);
        color: #7de08c;
      }
      .badge.error {
        background: rgba(255, 110, 110, 0.16);
        color: #ff8585;
      }
      .badge.stopped {
        background: rgba(185, 185, 195, 0.16);
        color: #bcbcc8;
      }
      .qempty {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.4);
      }
      /* 중지/재실행 버튼 */
      .stop-btn {
        font-size: 11.5px;
        font-weight: 600;
        cursor: pointer;
        padding: 3px 10px;
        border-radius: 999px;
        border: 1px solid rgba(255, 110, 110, 0.5);
        background: transparent;
        color: #ff8585;
      }
      .stop-btn:hover {
        background: rgba(255, 110, 110, 0.16);
      }
      .stop-btn:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .retry-btn {
        margin-left: 2px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid rgba(150, 170, 255, 0.5);
        background: transparent;
        color: #a9b8ff;
      }
      .retry-btn:hover {
        background: rgba(150, 170, 255, 0.16);
      }
      .retry-btn:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .gen-btn,
      .resume-btn {
        margin-left: 2px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid rgba(120, 220, 150, 0.5);
        background: transparent;
        color: #8de8a8;
      }
      .gen-btn:hover,
      .resume-btn:hover {
        background: rgba(120, 220, 150, 0.16);
      }
      .gen-btn:disabled,
      .resume-btn:disabled {
        opacity: 0.5;
        cursor: default;
      }
      /* 큐 줄 삭제 — 되돌릴 수 없어 붉은 계열로 구분하고 확인 후 실행한다. */
      .del-btn {
        margin-left: 2px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid rgba(255, 110, 110, 0.4);
        background: transparent;
        color: #ff8585;
      }
      .del-btn:hover {
        background: rgba(255, 110, 110, 0.16);
      }
      .del-btn:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #queue-now button {
        margin-left: 6px;
      }

      /* 주마등 릴 (전 장면 → 90초 단일 영상) */
      .video-panel {
        margin-bottom: 28px;
        padding: 14px 16px;
        border-radius: 12px;
        background: rgba(255, 190, 80, 0.05);
        border: 1px solid rgba(255, 190, 80, 0.18);
      }
      .video-head h2 {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: #ffc466;
        margin-bottom: 12px;
      }
      .video-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .video-label {
        font-size: 12.5px;
        color: rgba(255, 255, 255, 0.6);
        margin-right: auto; /* 레이블을 왼쪽으로 밀어 버튼들을 오른쪽에 모은다 */
      }
      .video-label b {
        color: #e8e6e3;
      }
      /* 노란 계열 기본 버튼(영상 생성/릴 생성). stop-btn(일시정지·중단)은 별도 붉은 스타일 사용. */
      .video-row button:not(.stop-btn) {
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        padding: 6px 13px;
        border-radius: 999px;
        border: 1px solid rgba(255, 190, 80, 0.5);
        background: transparent;
        color: #ffc466;
      }
      .video-row button:not(.stop-btn):hover {
        background: rgba(255, 190, 80, 0.16);
      }
      .video-row button:not(.stop-btn):disabled {
        opacity: 0.45;
        cursor: default;
      }
      .video-panel video {
        display: block;
        width: 100%;
        max-width: 720px;
        border-radius: 10px;
        background: #000;
        aspect-ratio: 832 / 480;
        margin-top: 6px;
      }

      /* 확대 보기 */
      #zoom {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.92);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 50;
        cursor: zoom-out;
      }
      #zoom.show {
        display: flex;
      }
      #zoom img {
        max-width: 94vw;
        max-height: 90vh;
      }
      #zoom .cap {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        color: rgba(255, 255, 255, 0.7);
        max-width: 90vw;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside id="sidebar">
        <div class="side-head">
          <h1>생애 라이브러리</h1>
          <input id="persona-search" type="search" placeholder="이름 검색…" autocomplete="off" />
        </div>
        <div class="side-list" id="persona-list"></div>
      </aside>
      <div class="content">
        <header>
          <span class="cur-name" id="cur-name"></span>
          <span class="counts" id="counts"></span>
          <span class="gender-ctl" id="gender-ctl">
            <label for="gender">성별</label>
            <select id="gender">
              <option value="">미지정</option>
              <option value="male">남성</option>
              <option value="female">여성</option>
            </select>
            <span class="gsrc" id="gender-src"></span>
          </span>
          <span class="session-ctl" id="session-ctl">
            <span class="session-label" id="session-label">세션 미설정</span>
            <button
              id="session-set"
              title="1차 체험 — 과거 회귀 주마등(장례식→탄생까지 되감는 릴→유령 대화)을 재생합니다"
            >
              1차 체험 세션
            </button>
            <button
              id="session-set2"
              title="2차 체험 — 유령 대화로 바뀐 마음가짐 기반 분기 미래(다른 삶의 장례식·현재→90세 릴)를 재생합니다. 분기 미래 생성이 끝난 참가자만 가능합니다."
            >
              2차 체험 세션
            </button>
            <button
              id="session-clear"
              class="hidden"
              title="현재 세션을 해제하고 런타임을 대기(IDLE)로 되돌립니다"
            >
              세션 나가기
            </button>
          </span>
          <span class="regenall-ctl" id="regenall-ctl">
            <button
              id="regen-all"
              title="이 참가자의 모든 장면을 현재 프롬프트로 다시 생성합니다 (장당 ~15초)"
            >
              전체 재생성
            </button>
            <span class="regenall-status" id="regenall-status"></span>
          </span>
        </header>
        <section id="queue-panel" class="hidden">
          <div class="qhead">
            <h2>생성 큐</h2>
            <span class="now" id="queue-now"></span>
            <button id="auto-toggle"></button>
          </div>
          <div class="qlist" id="queue-list"></div>
        </section>
        <main id="main"></main>
      </div>
    </div>
    <div id="status"></div>
    <div id="zoom">
      <img />
      <div class="cap"></div>
    </div>

    <script>
      const $ = (s, el = document) => el.querySelector(s)
      let pid = null
      let manifest = null
      let personas = [] // 최신 생성순(내림차순) persona 목록 캐시
      let personaFilter = '' // 사이드바 이름 검색어
      let sessionPid = null // 현재 세션 참가자 (4창 런타임이 재생 중인 대상)
      let sessionExp = 'first' // 현재 세션 체험 종류 — 'first'(1차) | 'second'(2차: 분기 미래)
      let sceneTab = 'main' // 장면 뷰 탭 — 'main'(운명적) | 'branch'(분기 미래). 분기 장면 없으면 무시.
      let videoState = null // /api/queue의 video: { building:{pid,kind}, queue, job, last }
      let lastVideoAt = 0 // 마지막으로 반영한 영상 작업 완료 시각 (완료 감지→manifest 재로딩)
      let reelPhotoState = null // /api/queue의 reelPhotos: { job, queue, last } — 릴 사진 대기열·잡
      let lastReelPhotoAt = 0 // 마지막으로 반영한 릴 사진 잡 완료 시각
      let funeralState = null // /api/queue의 funeral: { job, queue, last } — 장례식 대기열·잡
      let lastFuneralAt = 0 // 마지막으로 반영한 장례식 잡 완료 시각
      let lastFuneralSig = '' // 장례식 잡·대기열 구성 시그니처(바뀌면 패널 재렌더)
      // 장례식은 두 벌(variant)이라 접이 상태도 판별로 따로 둔다.
      const FUNERAL_VARIANTS = ['present', 'future']
      const funeralLabel = (v) => (v === 'future' ? '미래 장례식(90세)' : '현재 장례식')
      const funeralKey = (v) => (v === 'future' ? 'funeralFuture' : 'funeral')
      let funeralHistOpen = { present: false, future: false } // 히스토리 접이 상태 — 폴링 재렌더에도 유지
      let funeralCastOpen = { present: false, future: false } // 조문객 캐스트 접이 상태
      // 장지(안식처) 파노라마 — 1차 전용, variant 없음. 장례식과 같은 큐/승인 구조.
      let graveState = null // /api/queue의 grave: { job, queue, last }
      let lastGraveAt = 0
      let lastGraveSig = ''
      let graveHistOpen = false
      let lastReelPhotoDone = -1 // 릴 사진 진행 중 마지막으로 그린 done 수(바뀔 때만 썸네일 재로딩)
      let lastReelPhotoSig = '' // 잡·대기열 변화 감지용(바뀔 때만 영상 패널 재렌더 — 깜빡임 방지)
      let lastRegenAt = 0 // 마지막으로 반영한 전체 재생성 완료 시각
      let lastRegenDone = -1 // 전체 재생성 진행 중 마지막으로 그린 done 수 (바뀔 때만 그리드 재로딩)
      // 분기 미래(3차) — 유령 대화 기록 기반 alt 파노라마·분기 릴·분기 장례식 일괄 생성.
      let transcriptInfo = null // 현재 참가자의 유령 대화 기록 유무({exists,turns}) — 생성 버튼 게이트
      let branchedJob = null // 진행 중인 분기 미래 잡(currentInfo) — /api/queue의 current가 '#branched'일 때
      let lastBranchedSig = '' // 분기 잡 변화 감지(바뀔 때만 재렌더/재로딩)

      // 생성 시각 → 상대 표기 (사이드바 큐 정렬 근거를 사람이 읽게)
      function timeAgo(iso) {
        const t = new Date(iso).getTime()
        if (!isFinite(t)) return ''
        const s = Math.floor((Date.now() - t) / 1000)
        if (s < 60) return '방금'
        const m = Math.floor(s / 60)
        if (m < 60) return `${m}분 전`
        const h = Math.floor(m / 60)
        if (h < 24) return `${h}시간 전`
        return `${Math.floor(h / 24)}일 전`
      }

      const api = (p, opts) =>
        fetch(p, opts).then(async (r) => {
          const j = await r.json()
          if (!r.ok) throw new Error(j.error || r.status)
          return j
        })
      const imgUrl = (e) => `/img/${pid}/${e.file}?rev=${e.rev || 0}`
      const setStatus = (t) => {
        $('#status').textContent = t
      }

      // 사이드바 목록 렌더 — 검색어(personaFilter)로 걸러 최신순으로 나열하고
      // 현재 선택(pid)을 강조한다. 데이터는 personas 캐시에서만 읽어 재호출이 싸다.
      function renderPersonaList() {
        const el = $('#persona-list')
        const q = personaFilter.trim().toLowerCase()
        const shown = q
          ? personas.filter((p) => (p.name || p.personaId).toLowerCase().includes(q))
          : personas
        if (shown.length === 0) {
          el.innerHTML = `<div class="side-empty">${
            personas.length === 0 ? '아직 제출/생성된 사용자가 없습니다.' : '검색 결과 없음'
          }</div>`
          return
        }
        el.innerHTML = shown
          .map((p) => {
            const ready = isReviewable(p)
            // 뱃지: 로컬에 없고 클라우드 정본만 있으면 ☁(선택 시 자동으로 받아옴),
            //       아직 생성 전이면 대기/생성중, 실패면 오류.
            let badge = ''
            if (ready && !p.local && p.cloud)
              badge = `<span class="pbadge pb-cloud" title="클라우드 정본 — 선택하면 받아옵니다">☁</span>`
            else if (!ready) {
              const st = pendingLabel(p)
              const cls = st.kind === 'error' ? 'pb-error' : 'pb-pending'
              badge = `<span class="pbadge ${cls}">${st.text}</span>`
            }
            const meta = ready
              ? `${p.total || p.imageCount || 0}장${p.videoCount ? ` · 🎬${p.videoCount}` : ''}${p.reel ? ' · 릴' : ''} · ${timeAgo(p.createdAt)}`
              : timeAgo(p.createdAt)
            return (
              `<button class="pitem${p.personaId === pid ? ' active' : ''}${ready ? '' : ' notready'}" data-pid="${p.personaId}" data-ready="${ready ? 1 : 0}">` +
              `<span class="pname">${p.name || p.personaId}${badge}</span>` +
              `<span class="pmeta">${meta}` +
              `${p.personaId === sessionPid ? ' · <span class="psession">● 세션</span>' : ''}</span>` +
              `</button>`
            )
          })
          .join('')
      }

      // 리뷰 가능 = manifest 정본이 로컬에 있거나(local) Firebase에 있어(hasManifest) 받아올 수 있는 경우.
      // (generatedPanoramaImages만 있고 manifest가 없으면 재구성이 안 되므로 '대기'로 둔다 — sync:manifests 필요.)
      function isReviewable(p) {
        return Boolean(p.local || p.hasManifest)
      }

      // 아직 생성 전인 제출의 상태 라벨(직업 flow status 또는 인생그래프 세션 상태 요약).
      function pendingLabel(p) {
        const vals = [p.status, ...(p.sessions ? Object.values(p.sessions) : [])].filter(Boolean)
        if (vals.includes('error')) return { kind: 'error', text: '오류' }
        if (vals.includes('generating')) return { kind: 'pending', text: '생성중' }
        return { kind: 'pending', text: '대기' }
      }

      // keep=true면 현재 보고 있던 persona 선택을 유지한 채 목록만 갱신한다
      // (자동 생성 완료로 새 persona가 들어와도 검토 중이던 화면이 튀지 않도록).
      async function loadPersonas({ keep = false } = {}) {
        const list = await api('/api/personas')
        // 최신 생성순(내림차순). createdAt 없는 옛 persona는 뒤로 민다.
        list.sort(
          (a, b) => (new Date(b.createdAt).getTime() || 0) - (new Date(a.createdAt).getTime() || 0)
        )
        personas = list
        const prev = pid
        if (list.length === 0) {
          pid = null
          $('#cur-name').textContent = ''
          renderPersonaList()
          $('#main').innerHTML =
            '<p style="color:#888">라이브러리가 비어 있습니다. 제출을 기다리거나 npm run gen:library 로 생성하세요.</p>'
          return
        }
        if (keep && prev && list.some((p) => p.personaId === prev)) {
          pid = prev
          renderPersonaList()
          return // 선택 유지, manifest 재로딩 생략
        }
        // 기본 선택은 '리뷰 가능한' 첫 항목(생성 전 제출은 건너뜀). 없으면 안내만.
        const firstReady = list.find((p) => isReviewable(p))
        if (!firstReady) {
          pid = null
          renderPersonaList()
          $('#main').innerHTML =
            '<p style="color:#888">제출은 있으나 아직 생성된 사용자가 없습니다. 생성이 끝나면 여기서 리뷰할 수 있습니다.</p>'
          return
        }
        pid = firstReady.personaId
        renderPersonaList()
        await loadManifest()
      }

      async function loadManifest() {
        let m
        try {
          m = await api(`/api/personas/${pid}`)
        } catch (err) {
          // 클라우드 정본 받기(hydrate)에 실패했거나 로컬/정본 모두 없을 때.
          $('#cur-name').textContent = personas.find((x) => x.personaId === pid)?.name || pid
          $('#main').innerHTML = `<p style="color:#ff9a9a">불러오기 실패: ${err.message}</p>`
          return
        }
        manifest = m
        loadTranscript() // 유령 대화 기록 유무(분기 미래 버튼 게이트) — 비동기로 채워지면 재렌더
        // 생성은 시작됐지만 첫 장면이 아직 없음(_pending) — 에러가 아니라 대기 상태.
        // 실시간 보기 폴링(pollQueue)이 새 장면이 저장되는 대로 다시 그린다.
        if (m._pending || !m.images?.length) {
          $('#cur-name').textContent =
            m.name || personas.find((x) => x.personaId === pid)?.name || pid
          $('#main').innerHTML =
            '<p style="color:#888">아직 첫 장면 생성 전입니다 — 곧 나타납니다…</p>'
          return
        }
        render()
      }

      // 유령 대화 기록 유무 조회 — 분기 미래 생성 버튼 게이트. 참가자를 바꾸는 사이 응답이
      // 늦게 오면 버릴 수 있게 조회 시점의 pid를 잡아 둔다.
      async function loadTranscript() {
        const forPid = pid
        transcriptInfo = null
        try {
          const t = await api(`/api/personas/${forPid}/transcript`)
          if (pid === forPid) {
            transcriptInfo = t
            mountVideo()
          }
        } catch {
          /* 게이트만 못 열 뿐 — 참가자 재선택 시 재시도된다 */
        }
      }

      // 성별 표시: 자동 감지값 + 근거 캡션(툴팁). 수정하면 프롬프트가 갱신되고
      // 이후 재생성부터 반영된다 (기존 이미지는 그대로).
      function renderGender() {
        const g = manifest?.profile?.gender || ''
        $('#gender').value = g
        const src = manifest?.gender?.source
        $('#gender-src').textContent =
          src === 'auto'
            ? '자동감지'
            : src === 'manual'
              ? '수동'
              : src === 'profile'
                ? '제출값'
                : ''
        $('#gender-ctl').title = manifest?.gender?.caption || ''
      }

      function counts() {
        const total = manifest.images.length
        const failed = manifest.images.filter((im) => im.failed).length
        const branch = manifest.images.filter((im) => im.branch && !im.failed).length
        $('#counts').innerHTML =
          `총 <b>${total - failed}</b>장` +
          (branch ? ` · <b style="color:#b98cff">분기 ${branch}</b>` : '') +
          (failed ? ` · <b style="color:#ff8585">실패 ${failed}</b>` : '')
      }

      // 세션 참가자 컨트롤 — 현재 세션 대상과, 보고 있는 참가자를 세션으로 지정하는 버튼.
      function renderSessionCtl() {
        const label = $('#session-label')
        const btn = $('#session-set')
        const btn2 = $('#session-set2')
        const clearBtn = $('#session-clear')
        if (sessionPid) {
          const p = personas.find((x) => x.personaId === sessionPid)
          label.innerHTML = `세션: <b>${p?.name || sessionPid}</b> (${sessionExp === 'second' ? '2차 체험' : '1차 체험'})`
        } else {
          label.textContent = '세션 미설정'
        }
        const isCur = (exp) => pid && pid === sessionPid && sessionExp === exp
        btn.disabled = !pid || isCur('first')
        btn.textContent = isCur('first') ? '현재 세션 (1차)' : '1차 체험 세션'
        // 2차 체험은 분기 미래(3차 플로우) 릴이 생성된 참가자만 — 지금 보고 있는 manifest로 판정한다.
        const branchedReady = (manifest?.reelPhotosBranched || []).some((e) => !e.failed && e.file)
        btn2.disabled = !pid || !branchedReady || isCur('second')
        btn2.textContent = isCur('second') ? '현재 세션 (2차)' : '2차 체험 세션'
        btn2.title = branchedReady
          ? '2차 체험 — 분기 미래(다른 삶의 장례식·현재→90세 릴)를 재생합니다'
          : '분기 미래(3차 플로우) 생성이 아직 없습니다 — 유령 대화 기록으로 분기 미래를 먼저 생성하세요'
        clearBtn.classList.toggle('hidden', !sessionPid) // 세션 있을 때만 '나가기' 노출
      }

      // 서버에서 현재 세션 선택을 읽어 온다 (초기 로드 시).
      async function loadSession() {
        try {
          const s = await api('/api/session')
          sessionPid = s.personaId || null
          sessionExp = s.experience === 'second' ? 'second' : 'first'
        } catch {
          sessionPid = null // 세션 API가 없는 구버전 서버면 조용히 미설정 처리.
          sessionExp = 'first'
        }
        renderSessionCtl()
        renderPersonaList()
      }

      // 별도 승인 절차 없음 — 전 장이 기본 노출. 문제 장·실패 장만 재생성으로 교체한다.
      // failed 장(생성 중 타임아웃 등으로 건너뜀)은 플레이스홀더로 표시하고 재생성 버튼을 노출한다.
      function card(entry) {
        const div = document.createElement('div')
        div.className = 'card' + (entry.failed ? ' failed' : '')
        const sub = `${entry.age}살 · ${entry.year}${entry.isPast ? '' : ' (미래)'}`
        // 카드 썸네일 비율을 실제 생성 크기에 맞춘다(파노라마 4:1 등이 잘리지 않게).
        const im = manifest && manifest.image
        const ar = im && im.width && im.height ? `${im.width} / ${im.height}` : '1344 / 768'
        const media = entry.failed
          ? `<div class="card-failed" style="aspect-ratio:${ar}">생성 실패 — 재생성 필요</div>`
          : `<img src="${imgUrl(entry)}" loading="lazy" style="aspect-ratio:${ar}" title="${entry.prompt.replaceAll('"', '&quot;')}" />`
        div.innerHTML = `
        ${media}
        <div class="meta"><span class="id">${entry.id}</span><span class="sub">${sub}</span>${entry.failed ? '<span class="badge error">실패</span>' : ''}</div>
        <div class="actions">
          <button class="re" title="Gemini부터 전체 다시 생성">재생성</button>
          <button class="re-dist" title="카메라를 더 멀리 — 인물 작게, 바닥·천장이 잘리지 않게 재생성">거리감↑</button>
        </div>`

        const imgEl = $('img', div)
        if (imgEl)
          imgEl.addEventListener('click', () => {
            $('#zoom img').src = imgUrl(entry)
            $('#zoom .cap').textContent = `${entry.id} — ${entry.prompt}`
            $('#zoom').classList.add('show')
          })
        // 재생성(기본) / 거리감↑(distance: 카메라를 더 물려 바닥·천장 포함) 공통 핸들러
        const wireRegen = (sel, label, distance) => {
          $(sel, div).addEventListener('click', async () => {
            const btn = $(sel, div)
            btn.disabled = true
            btn.textContent = '생성 중…'
            setStatus(`${entry.id} ${label} 중 (~15초)`)
            try {
              const out = await api(`/api/personas/${pid}/regen`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: entry.id, distance })
              })
              Object.assign(entry, out.entry)
              delete entry.failed // 서버가 failed 키를 지워 보내므로 로컬에서도 해제
              setStatus(`${entry.id} ${label} 완료`)
              render()
            } catch (e) {
              setStatus(`${label} 실패: ${e.message}`)
              btn.disabled = false
              btn.textContent = label === '재생성' ? '재생성' : '거리감↑'
            }
          })
        }
        wireRegen('.re', '재생성', false)
        wireRegen('.re-dist', '거리감 재생성', true)
        return div
      }

      function render() {
        $('#cur-name').textContent = manifest?.profile?.name || pid || ''
        counts()
        renderGender()
        renderSessionCtl()
        const main = $('#main')
        main.innerHTML = ''
        // 단계(stageIndex)별로 묶기. 분기 미래(branch:true) 장면은 stageIndex가 0부터 다시 시작해
        // 기존 32장 플랜과 충돌하므로 따로 묶어, 기존 단계들 **뒤에** 자기 섹션(보라 표시)으로 그린다.
        const stages = new Map()
        const branchStages = new Map()
        manifest.images.forEach((img) => {
          const m = img.branch ? branchStages : stages
          if (!m.has(img.stageIndex)) m.set(img.stageIndex, [])
          m.get(img.stageIndex).push(img)
        })
        const addSection = (si, scenes, branch) => {
          const age = scenes[0].age
          const section = document.createElement('section')
          section.className = branch ? 'stage branch' : 'stage'
          section.innerHTML = branch
            ? `<h2>분기 미래 — ${age}살 (${scenes[0].year})</h2>`
            : `<h2>단계 ${si} — ${age}살 (${scenes[0].year}${scenes[0].isPast ? '' : ', 미래'})</h2>`
          const row = document.createElement('div')
          row.className = 'row'
          scenes.forEach((s) => row.appendChild(card(s)))
          section.appendChild(row)
          main.appendChild(section)
        }
        // 분기 미래가 있으면 스크롤이 배로 길어지므로 탭으로 나눠 한쪽만 그린다. 없으면 탭바 생략.
        const hasBranch = branchStages.size > 0
        if (!hasBranch) sceneTab = 'main'
        const showMain = sceneTab === 'main'
        if (hasBranch) {
          const tabs = document.createElement('div')
          tabs.className = 'scene-tabs'
          tabs.innerHTML =
            `<button class="${showMain ? 'active' : ''}" data-tab="main">운명적 미래 (${manifest.images.length - [...branchStages.values()].flat().length}장)</button>` +
            `<button class="branch-tab ${showMain ? '' : 'active'}" data-tab="branch">분기 미래 (${[...branchStages.values()].flat().length}장)</button>`
          tabs.addEventListener('click', (e) => {
            const t = e.target.closest('button[data-tab]')
            if (!t || t.dataset.tab === sceneTab) return
            sceneTab = t.dataset.tab
            render()
          })
          main.appendChild(tabs)
        }
        if (showMain)
          for (const [si, scenes] of [...stages.entries()].sort((a, b) => a[0] - b[0]))
            addSection(si, scenes, false)
        else
          for (const [si, scenes] of [...branchStages.entries()].sort((a, b) => a[0] - b[0]))
            addSection(si, scenes, true)
        main.insertAdjacentHTML('afterbegin', '<div id="reel-slot"></div>')
        mountVideo()
      }

      // 주마등 영상 패널 — 2단계. ① 영상(클립) 생성: 전 장면을 Wan 클립으로(N/총). ② 릴 합성:
      // 사전 생성된 클립을 90초 릴로. 각각 버튼. 진행 상태는 videoState(pollQueue가 갱신).
      function renderVideo() {
        if (!pid || !manifest) return ''
        const cs = manifest._clipStatus || { clipsDone: 0, clipsTotal: manifest.images.length }
        const reel = manifest.reel
        const b = videoState && videoState.building // { pid, kind } | null
        const job = (videoState && videoState.job) || {}
        const buildingClips = b && b.pid === pid && b.kind === 'clips'
        const buildingReel = b && b.pid === pid && b.kind === 'reel'
        const buildingResume = b && b.pid === pid && b.kind === 'resume'
        const qHas = (kind) =>
          videoState && (videoState.queue || []).some((v) => v.pid === pid && v.kind === kind)

        // ── ① 영상 생성 행 (seedance-flf=전이 | wan=클립) ──
        const unit = cs.mode === 'seedance' ? '루프' : '클립'
        let clipRow
        if (buildingClips) {
          clipRow =
            `<span class="video-label">영상 ${unit} <b>${job.done || 0}/${job.total || cs.clipsTotal}</b> 생성 중…</span>` +
            `<button id="video-pause" class="stop-btn">일시정지</button>` +
            `<button id="video-stop" class="stop-btn">중단</button>`
        } else if (buildingResume) {
          const ph = job.phase === 'fetch' ? 'Firebase 회수' : '이어서 생성'
          clipRow = `<span class="video-label">${ph} <b>${job.done || 0}/${job.total || cs.clipsTotal}</b> …</span>`
        } else {
          const label = qHas('clips')
            ? '대기 중…'
            : cs.clipsDone === 0
              ? '영상 생성 시작'
              : cs.clipsDone < cs.clipsTotal
                ? `이어서 생성 (${cs.clipsDone}/${cs.clipsTotal})`
                : '영상 완료 ✓'
          const done = cs.clipsDone >= cs.clipsTotal && cs.clipsTotal > 0
          // 생성 중 큐가 끊겨 진행도가 어긋난 경우(예: 0/30), Firebase 정본에 저장된 클립만큼 회수하고
          // 부족분만 이어서 생성하는 버튼. Firebase 클립 수(fb.clips)를 함께 보여줘 실제 진행도를 알린다.
          const fb = manifest._firebase
          const fbClips = fb ? fb.clips : null
          const resumeBtn =
            !done && !qHas('resume')
              ? `<button id="video-resume" title="Firebase에 저장된 클립을 회수하고 부족한 장면만 이어서 생성 → 재업로드">이어서 생성${fbClips != null ? ` (☁ ${fbClips}/${cs.clipsTotal})` : ''}</button>`
              : qHas('resume')
                ? `<button disabled>이어서 생성 대기 중…</button>`
                : ''
          clipRow =
            `<span class="video-label">영상 ${unit} <b>${cs.clipsDone}/${cs.clipsTotal}</b>${done ? ' · 완료' : ''}</span>` +
            `<button id="video-genclips"${qHas('clips') || done ? ' disabled' : ''}>${label}</button>` +
            resumeBtn
        }

        // ── ② 릴 합성 행 ──
        let reelRow
        const reelMeta =
          reel && reel.durationSec
            ? `${reel.durationSec.toFixed(1)}초 · ${timeAgo(reel.builtAt)}`
            : '없음'
        if (buildingReel) {
          reelRow = `<span class="video-label">릴 합성 중…</span>`
        } else {
          const canReel = cs.clipsDone > 0
          const label = qHas('reel') ? '대기 중…' : reel ? '릴 재생성' : '릴 생성'
          reelRow =
            `<span class="video-label">릴 <b>${reelMeta}</b></span>` +
            `<button id="reel-build"${!canReel || qHas('reel') ? ' disabled' : ''} title="${canReel ? '' : '먼저 영상 클립을 생성하세요'}">${label}</button>`
        }

        const player =
          reel && reel.file && !buildingReel
            ? `<video controls playsinline preload="metadata" src="/media/${pid}/${reel.file}?rev=${reel.rev || 0}"></video>`
            : ''

        // ── ③ 릴 사진(3:4 필름스트립) — 파노라마와 별개 플로우. 새 제출은 워커가 두 판을 자동 생성,
        //     이전 페르소나는 여기 버튼으로 백필. 전부 있으면 '재생성'(force), 부족하면 '이어서'.
        //     판(variant)마다 한 행: 과거 릴(3~현재, 1차 주마등) / 미래 릴(현재 다음 해~90세, 2차).
        const rpJob = reelPhotoState && reelPhotoState.job
        const rpQueue = (reelPhotoState && reelPhotoState.queue) || []
        // 릴 한 판의 상태 줄 + 썸네일. variant는 'past' | 'future'.
        const renderReelRow = (variant) => {
          const isFuture = variant === 'future'
          const L = isFuture ? '미래 릴' : '과거 릴'
          const rp = manifest[isFuture ? 'reelPhotosFuture' : 'reelPhotos'] || []
          const rpOk = rp.filter((e) => !e.failed).length
          const rpTotal = rp.length || 12
          const mine = rpJob && rpJob.pid === pid && (rpJob.variant || 'past') === variant
          const queuedAt = rpQueue.findIndex(
            (q) => q.pid === pid && (q.variant || 'past') === variant
          )
          const vAttr = ` data-variant="${variant}"`
          let row
          if (mine) {
            row =
              `<span class="video-label">${L} <b>${rpJob.done || 0}/${rpJob.total || rpTotal}</b> 생성 중…${rpQueue.length ? ` (대기 ${rpQueue.length}건)` : ''}</span>` +
              `<button data-act="reel-photos-stop" class="stop-btn">중지</button>`
          } else if (queuedAt >= 0) {
            row = `<span class="video-label">${L} <b>대기 중… (${queuedAt + 1}번째)</b></span>`
          } else {
            const complete = rp.length > 0 && rpOk === rp.length
            const label =
              rp.length === 0
                ? `${L} 생성 (12장)`
                : complete
                  ? `${L} 재생성`
                  : `이어서 생성 (${rpOk}/${rpTotal})`
            // 다른 페르소나가 생성 중이어도 대기열에 등록되므로 버튼은 항상 활성 — 눌러두면 순차 실행.
            row =
              `<span class="video-label">${L} <b>${rpOk}/${rpTotal}</b>${complete ? ' · 완료' : ''}</span>` +
              `<button data-act="reel-photos-gen" data-force="${complete ? 1 : 0}"${vAttr}>${rpJob ? label + ' (대기열 등록)' : label}</button>`
          }
          const thumbs = rp.length
            ? `<div class="video-row" style="flex-wrap:wrap;gap:4px">` +
              rp
                .map((e) =>
                  e.failed
                    ? `<span title="${e.age}살 — 실패" style="width:74px;height:56px;display:inline-flex;align-items:center;justify-content:center;background:#3a1f1f;color:#e07070;border-radius:3px;font-size:11px">✗${e.age}</span>`
                    : `<img class="reel-thumb" src="/img/${pid}/${e.file}?e=${e.elapsedMs || 0}" data-full="/img/${pid}/${e.file}" data-cap="${L} · ${e.age}살 — ${(e.scene || '').replace(/"/g, '&quot;')}" title="${e.age}살 (클릭=크게)" style="width:74px;height:56px;object-fit:cover;border-radius:3px;cursor:zoom-in" loading="lazy">`
                )
                .join('') +
              `</div>`
            : ''
          return `<div class="video-row">${row}</div>${thumbs}`
        }
        const reelPhotoBlock = renderReelRow('past') + renderReelRow('future')

        // ── ③-b 분기 미래(3차) 일괄 생성 — 유령 대화 기록을 재료로 alt 파노라마·분기 릴·
        //     분기 장례식을 덧생성한다(서버 startBranchedFuture). 1차 체험(유령 대화)이 있어야
        //     재료가 있으므로 대화 기록이 확인된 참가자만 버튼이 열린다. 완료되면 세션 헤더의
        //     '2차 체험 세션' 버튼이 활성화된다(reelPhotosBranched 게이트).
        const rb = manifest.reelPhotosBranched || []
        const rbOk = rb.filter((e) => !e.failed && e.file).length
        const bMine = branchedJob && (branchedJob.pid === pid || branchedJob.personaId === pid)
        let bRow
        if (bMine) {
          bRow =
            `<span class="video-label">분기 미래 <b>${branchedJob.done || 0}/${branchedJob.total || '?'}</b> 생성 중…</span>` +
            `<button data-act="branched-stop" class="stop-btn">중지</button>`
        } else {
          const ready = Boolean(transcriptInfo?.exists)
          const complete = rb.length > 0 && rbOk === rb.length
          bRow =
            `<span class="video-label">분기 미래(3차) <b>${rbOk}/${rb.length || '-'}</b>${complete ? ' · 완료' : ''}</span>` +
            `<button data-act="branched-gen"${ready && !branchedJob ? '' : ' disabled'} title="${
              !ready
                ? '1차 체험(유령 대화) 후에 생성할 수 있습니다 — 이 참가자의 대화 기록이 아직 없습니다'
                : branchedJob
                  ? '다른 생성이 진행 중입니다 — 끝난 뒤 다시 시도하세요'
                  : `유령 대화 ${transcriptInfo.turns}턴 기록 확인 — alt 파노라마·분기 릴·분기 장례식을 생성합니다`
            }">${rb.length ? '분기 미래 다시 생성' : '분기 미래 생성'}</button>`
        }
        // 분기 릴 썸네일 — 과거/미래 릴과 같은 표기(실패 장은 ✗나이).
        const bThumbs = rb.length
          ? `<div class="video-row" style="flex-wrap:wrap;gap:4px">` +
            rb
              .map((e) =>
                e.failed
                  ? `<span title="${e.age}살 — 실패" style="width:74px;height:56px;display:inline-flex;align-items:center;justify-content:center;background:#3a1f1f;color:#e07070;border-radius:3px;font-size:11px">✗${e.age}</span>`
                  : `<img class="reel-thumb" src="/img/${pid}/${e.file}?e=${e.elapsedMs || 0}" data-full="/img/${pid}/${e.file}" data-cap="분기 릴 · ${e.age}살 — ${(e.scene || '').replace(/"/g, '&quot;')}" title="${e.age}살 (클릭=크게)" style="width:74px;height:56px;object-fit:cover;border-radius:3px;cursor:zoom-in" loading="lazy">`
              )
              .join('') +
            `</div>`
          : ''
        const branchedBlock = `<div class="video-row">${bRow}</div>${bThumbs}`

        // ── ☁ Firebase 정본 상태 (로컬 캐시와 별개) ──
        let fbRow = ''
        const fb = manifest._firebase
        if (fb) {
          const behind = fb.clips < fb.total
          fbRow =
            `<div class="video-row"><span class="video-label" style="opacity:.85">` +
            `☁ Firebase <b>${fb.clips}/${fb.total}</b> 클립 · reel ${fb.reel ? '✓' : '✗'}` +
            (behind ? ` <span style="color:#e0a030">— 아직 부족(이어서 생성 필요)</span>` : '') +
            `</span></div>`
        }

        return (
          `<section class="video-panel"><div class="video-head"><h2>주마등 영상</h2></div>` +
          `<div class="video-row">${clipRow}</div>` +
          `<div class="video-row">${reelRow}</div>` +
          `${reelPhotoBlock}${branchedBlock}${fbRow}${player}</section>`
        )
      }
      // 장례식 패널 — 고인 시선의 한국식 장례식장 4:1 파노라마(Gemini) → Wan2.2 영상.
      // 판별(variant)로 두 벌을 각각 그린다: 'present'(지금의 죽음, manifest.funeral) /
      // 'future'(이대로 살아 90세에 맞는 죽음, manifest.funeralFuture). 흐름은 완전히 같고
      // 상태·버튼·히스토리만 각자의 manifest 키를 본다.
      function renderFuneral(variant) {
        if (!pid || !manifest) return ''
        const fn = manifest[funeralKey(variant)] || null
        const fj = funeralState && funeralState.job
        const fq = (funeralState && funeralState.queue) || []
        const mine = fj && fj.pid === pid && (fj.variant || 'present') === variant
        const queuedAt = fq.findIndex((q) => q.pid === pid && (q.variant || 'present') === variant)
        const vAttr = ` data-variant="${variant}"`
        const histOpen = funeralHistOpen[variant]
        const castOpen = funeralCastOpen[variant]

        // 상태 줄 + 버튼 — 승인 게이트 플로우:
        // 이미지 생성 → 검토(승인 대기) → [승인] → [영상화 시작] → 완료 → [Firebase 저장]
        // 버튼은 id가 아니라 data-act로 구분한다 — 두 판이 같은 화면에 나오므로 id는 중복된다.
        const L = funeralLabel(variant)
        let row
        if (mine) {
          const phase = fj.phase === 'video' ? 'Wan2.2 영상화' : 'Gemini 파노라마 생성'
          row =
            `<span class="video-label">${L} <b>${phase} 중…</b>${fq.length ? ` (대기 ${fq.length}건)` : ''}</span>` +
            `<button data-act="funeral-stop" class="stop-btn"${vAttr}>중지</button>`
        } else if (queuedAt >= 0) {
          row = `<span class="video-label">${L} <b>대기 중… (${queuedAt + 1}번째)</b></span>`
        } else if (!fn) {
          row =
            `<span class="video-label">${L} <b>없음</b></span>` +
            `<button data-act="funeral-gen" data-force="0"${vAttr}>이미지 생성${fj ? ' (대기열 등록)' : ''}</button>`
        } else if (fn.status === 'error') {
          row =
            `<span class="video-label">${L} <b><span style="color:#e07070">실패 (rev ${fn.rev}${fn.error ? ` — ${fn.error.slice(0, 80)}` : ''})</span></b></span>` +
            `<button data-act="funeral-gen" data-force="0"${vAttr}>이어서 생성</button>` +
            `<button data-act="funeral-gen" data-force="1"${vAttr}>새 rev로 재생성</button>`
        } else if (!fn.image) {
          // 이미지 단계가 시작만 되고 중단된 상태
          row =
            `<span class="video-label">${L} <b>이미지 생성 중단됨 (rev ${fn.rev})</b></span>` +
            `<button data-act="funeral-gen" data-force="0"${vAttr}>이어서 생성</button>`
        } else if (!fn.approved) {
          // 검토 단계 — 이미지가 admin에 떠 있고, 승인해야 영상화로 넘어간다.
          row =
            `<span class="video-label">${L} <b>이미지 검토 대기 (rev ${fn.rev})</b> — 아래 이미지를 확인하세요</span>` +
            `<button data-act="funeral-approve" style="background:#2a5a2a"${vAttr}>승인 (영상화 허용)</button>` +
            `<button data-act="funeral-gen" data-force="1"${vAttr}>이미지 재생성 (새 rev)</button>`
        } else if (!fn.video) {
          // 승인됨 — 영상화 대기. 영상화는 이 버튼으로만 시작된다.
          row =
            `<span class="video-label">${L} <b>승인됨 (rev ${fn.rev}${fn.approvedAt ? `, ${fn.approvedAt.slice(0, 16).replace('T', ' ')}` : ''})</b></span>` +
            `<button data-act="funeral-video"${vAttr}>영상화 시작 (Wan2.2)</button>` +
            `<button data-act="funeral-gen" data-force="1"${vAttr}>이미지 재생성 (새 rev)</button>`
        } else {
          // 완료 — Firebase 저장 버튼. 이미 저장했으면 시각 표시(다시 눌러 재저장 가능).
          const saved = fn.firebase
            ? ` · ☁ 저장됨 ${fn.firebase.uploadedAt ? fn.firebase.uploadedAt.slice(0, 16).replace('T', ' ') : ''}${(fn.firebase.rev || fn.rev) !== fn.rev ? ` (rev ${fn.firebase.rev} — 최신 아님)` : ''}`
            : ''
          row =
            `<span class="video-label">${L} <b>완료 (rev ${fn.rev}${(fn.videoRev || 1) > 1 ? `, 영상 v${fn.videoRev}` : ''})</b>${saved}</span>` +
            `<button data-act="funeral-upload"${vAttr}${fn.firebase && fn.firebase.rev === fn.rev ? ' title="이미 저장됨 — 다시 누르면 재업로드"' : ''}>Firebase 저장${fn.firebase && fn.firebase.rev === fn.rev ? ' ✓' : ''}</button>` +
            `<button data-act="funeral-video" data-force="1"${vAttr} title="같은 이미지로 영상만 다시 생성 (승인 유지)">영상 재생성</button>` +
            `<button data-act="funeral-gen" data-force="1"${vAttr}>재생성 (새 rev)</button>`
        }

        // 개인화 조문객 캐스트 — 접이식 한 줄 요약(기본 접힘). 펼치면 명단·행동 상세.
        let castRow = ''
        if (fn?.cast && fn.cast.length) {
          castRow =
            `<div class="video-row" style="font-size:12px;opacity:.85;flex-direction:column;align-items:flex-start;gap:2px">` +
            `<span data-act="funeral-cast-toggle"${vAttr} style="cursor:pointer;user-select:none">${castOpen ? '▾' : '▸'} 조문객 캐스트 ${fn.cast.length}명 — ${fn.cast.map((m) => m.who).join(', ')}</span>` +
            (castOpen
              ? fn.cast
                  .map(
                    (m) =>
                      `<span style="padding-left:14px">· <b>${m.who}</b> — ${m.imageAction || ''}${m.videoAction ? ` / 영상: ${m.videoAction}` : ''}</span>`
                  )
                  .join('')
              : '') +
            `</div>`
        } else if (fn?.image && fn.cast === null) {
          castRow = `<div class="video-row" style="font-size:12px;opacity:.6">조문객 캐스트 없음 — 본인 입력 데이터가 없어 범용 장면으로 생성됨</div>`
        }

        // 최신 rev 미리보기 (영정 포트레이트 + 파노라마 + 영상)
        let preview = ''
        if (fn?.portrait?.file)
          preview +=
            `<img class="reel-thumb" src="/img/${pid}/${fn.portrait.file}?r=${fn.rev}" data-full="/img/${pid}/${fn.portrait.file}"` +
            ` data-cap="${L} 영정 포트레이트 (pro — 파노라마 액자에 이대로 배치됨)" title="영정 포트레이트 (클릭=크게)"` +
            ` style="width:56px;height:74px;object-fit:cover;border-radius:3px;cursor:zoom-in" loading="lazy">`
        if (fn?.image?.file)
          preview +=
            `<img class="reel-thumb" src="/img/${pid}/${fn.image.file}?r=${fn.rev}" data-full="/img/${pid}/${fn.image.file}"` +
            ` data-cap="${L} rev ${fn.rev} — 고인 시선 파노라마" title="장례식 파노라마 (클릭=크게)"` +
            ` style="width:296px;height:74px;object-fit:cover;border-radius:3px;cursor:zoom-in" loading="lazy">`
        if (fn?.video?.file)
          preview +=
            `<video controls playsinline preload="metadata" src="/media/${pid}/${fn.video.file}?r=${fn.rev}"` +
            ` style="width:296px;border-radius:3px"></video>`
        // 영상만 재생성한 이전 판들(videoHistory) — 링크로 남겨 비교하며 튜닝할 수 있게.
        if (fn?.videoHistory?.length)
          preview +=
            `<span style="font-size:11px;opacity:.75;align-self:flex-end">이전 영상: ` +
            fn.videoHistory
              .map((v, i) => `<a href="/media/${pid}/${v.file}" target="_blank">v${i + 1}</a>`)
              .join(' · ') +
            `</span>`
        if (preview)
          preview = `<div class="video-row" style="flex-wrap:wrap;gap:6px">${preview}</div>`

        // 생성 히스토리 — 접이식(기본 접힘, 최신 rev은 위 미리보기가 이미 보여준다). 펼치면
        // 세로 목록 대신 가로 스크롤 스트립: rev당 카드 1개(썸네일 + rev·상태·영상 링크).
        // 패널 세로 길이는 rev가 아무리 쌓여도 카드 한 줄 높이로 고정된다.
        let history = ''
        const hist = fn?.history || []
        const past = hist.slice(0, -1) // 마지막(=현재 rev)은 위 미리보기와 중복이라 제외
        if (past.length) {
          const cards = past
            .slice()
            .reverse()
            .map((h) => {
              const st = h.status === 'done' ? '✓' : h.status === 'error' ? '✗' : '…'
              const stColor =
                h.status === 'done' ? '#7ab97a' : h.status === 'error' ? '#e07070' : '#aaa'
              const thumb = h.imageFile
                ? `<img class="reel-thumb" src="/img/${pid}/${h.imageFile}?r=${h.rev}" data-full="/img/${pid}/${h.imageFile}"` +
                  ` data-cap="${L} rev ${h.rev} · ${h.startedAt ? h.startedAt.slice(0, 16).replace('T', ' ') : ''}${h.error ? ` · ${String(h.error).slice(0, 80)}` : ''}"` +
                  ` style="width:160px;height:40px;object-fit:cover;border-radius:3px;cursor:zoom-in;display:block" loading="lazy">`
                : `<span style="width:160px;height:40px;display:flex;align-items:center;justify-content:center;background:#2a2a2a;border-radius:3px;color:#777;font-size:11px">이미지 없음</span>`
              return (
                `<span style="display:inline-flex;flex-direction:column;gap:2px;flex:none">` +
                thumb +
                `<span style="font-size:11px;opacity:.8"><span style="color:${stColor}">${st}</span> r${h.rev} · ${h.startedAt ? h.startedAt.slice(5, 16).replace('T', ' ') : '?'}` +
                (h.videoFile
                  ? ` <a href="/media/${pid}/${h.videoFile}" target="_blank" style="color:#7ab">▶</a>`
                  : '') +
                `</span></span>`
              )
            })
            .join('')
          history =
            `<div class="video-row" style="font-size:12px;flex-direction:column;align-items:stretch;gap:4px">` +
            `<span data-act="funeral-hist-toggle"${vAttr} style="cursor:pointer;user-select:none;opacity:.85">${histOpen ? '▾' : '▸'} 지난 히스토리 ${past.length}건 (rev ${past[0].rev}~${past[past.length - 1].rev})</span>` +
            (histOpen
              ? `<div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px">${cards}</div>`
              : '') +
            `</div>`
        }

        const head =
          variant === 'future'
            ? `Funeral Panorama — 미래 (90세의 죽음)`
            : `Funeral Panorama — 현재 (지금의 죽음)`
        return (
          `<section class="video-panel"><div class="video-head"><h2>${head}</h2></div>` +
          `<div class="video-row">${row}</div>${castRow}${preview}${history}</section>`
        )
      }
      // 장지(안식처) 패널 — 묻히길 바란 곳(burialSite)의 풍경 + 묘비석 4:1 파노라마 → Wan 영상.
      // 1차 플로우 전용(variant 없음). 흐름은 장례식 패널과 동일: 생성 → 검토·승인 → 영상화 → 저장.
      function renderGrave() {
        if (!pid || !manifest) return ''
        const gn = manifest.grave || null
        const gj = graveState && graveState.job
        const gq = (graveState && graveState.queue) || []
        const mine = gj && gj.pid === pid
        const queuedAt = gq.findIndex((q) => q.pid === pid)

        let row
        if (mine) {
          const phase = gj.phase === 'video' ? 'Wan2.2 영상화' : 'Gemini 파노라마 생성'
          row =
            `<span class="video-label">장지 <b>${phase} 중…</b>${gq.length ? ` (대기 ${gq.length}건)` : ''}</span>` +
            `<button data-act="grave-stop" class="stop-btn">중지</button>`
        } else if (queuedAt >= 0) {
          row = `<span class="video-label">장지 <b>대기 중… (${queuedAt + 1}번째)</b></span>`
        } else if (!gn) {
          row =
            `<span class="video-label">장지 <b>없음</b></span>` +
            `<button data-act="grave-gen" data-force="0">이미지 생성${gj ? ' (대기열 등록)' : ''}</button>`
        } else if (gn.status === 'error') {
          row =
            `<span class="video-label">장지 <b><span style="color:#e07070">실패 (rev ${gn.rev}${gn.error ? ` — ${gn.error.slice(0, 80)}` : ''})</span></b></span>` +
            `<button data-act="grave-gen" data-force="0">이어서 생성</button>` +
            `<button data-act="grave-gen" data-force="1">새 rev로 재생성</button>`
        } else if (!gn.image) {
          row =
            `<span class="video-label">장지 <b>이미지 생성 중단됨 (rev ${gn.rev})</b></span>` +
            `<button data-act="grave-gen" data-force="0">이어서 생성</button>`
        } else if (!gn.approved) {
          row =
            `<span class="video-label">장지 <b>이미지 검토 대기 (rev ${gn.rev})</b> — 아래 이미지를 확인하세요</span>` +
            `<button data-act="grave-approve" style="background:#2a5a2a">승인 (영상화 허용)</button>` +
            `<button data-act="grave-gen" data-force="1">이미지 재생성 (새 rev)</button>`
        } else if (!gn.video) {
          row =
            `<span class="video-label">장지 <b>승인됨 (rev ${gn.rev}${gn.approvedAt ? `, ${gn.approvedAt.slice(0, 16).replace('T', ' ')}` : ''})</b></span>` +
            `<button data-act="grave-video">영상화 시작 (Wan2.2)</button>` +
            `<button data-act="grave-gen" data-force="1">이미지 재생성 (새 rev)</button>`
        } else {
          const saved = gn.firebase
            ? ` · ☁ 저장됨 ${gn.firebase.uploadedAt ? gn.firebase.uploadedAt.slice(0, 16).replace('T', ' ') : ''}${(gn.firebase.rev || gn.rev) !== gn.rev ? ` (rev ${gn.firebase.rev} — 최신 아님)` : ''}`
            : ''
          row =
            `<span class="video-label">장지 <b>완료 (rev ${gn.rev}${(gn.videoRev || 1) > 1 ? `, 영상 v${gn.videoRev}` : ''})</b>${saved}</span>` +
            `<button data-act="grave-upload"${gn.firebase && gn.firebase.rev === gn.rev ? ' title="이미 저장됨 — 다시 누르면 재업로드"' : ''}>Firebase 저장${gn.firebase && gn.firebase.rev === gn.rev ? ' ✓' : ''}</button>` +
            `<button data-act="grave-video" data-force="1" title="같은 이미지로 영상만 다시 생성 (승인 유지)">영상 재생성</button>` +
            `<button data-act="grave-gen" data-force="1">재생성 (새 rev)</button>`
        }

        // 합성된 배경(안식처 판정) — 캐스트 줄 대응물. setting 없으면 디폴트 묘역 표시.
        let settingRow = ''
        if (gn?.setting) {
          settingRow = `<div class="video-row" style="font-size:12px;opacity:.85">안식처: ${gn.setting.setting}${gn.setting.marker ? ` · 표지: ${gn.setting.marker}` : ''}</div>`
        } else if (gn?.image && gn.setting === null) {
          settingRow = `<div class="video-row" style="font-size:12px;opacity:.6">희망 안식처 데이터 없음 — 디폴트 한국 묘역(봉분+묘비)으로 생성됨</div>`
        }

        let preview = ''
        if (gn?.image?.file)
          preview +=
            `<img class="reel-thumb" src="/img/${pid}/${gn.image.file}?r=${gn.rev}" data-full="/img/${pid}/${gn.image.file}"` +
            ` data-cap="장지 rev ${gn.rev} — 안식처 파노라마" title="장지 파노라마 (클릭=크게)"` +
            ` style="width:296px;height:74px;object-fit:cover;border-radius:3px;cursor:zoom-in" loading="lazy">`
        if (gn?.video?.file)
          preview +=
            `<video controls playsinline preload="metadata" src="/media/${pid}/${gn.video.file}?r=${gn.rev}"` +
            ` style="width:296px;border-radius:3px"></video>`
        if (gn?.videoHistory?.length)
          preview +=
            `<span style="font-size:11px;opacity:.75;align-self:flex-end">이전 영상: ` +
            gn.videoHistory
              .map((v, i) => `<a href="/media/${pid}/${v.file}" target="_blank">v${i + 1}</a>`)
              .join(' · ') +
            `</span>`
        if (preview)
          preview = `<div class="video-row" style="flex-wrap:wrap;gap:6px">${preview}</div>`

        // 지난 rev 히스토리 — 장례식 패널과 같은 가로 스트립(접이식).
        let history = ''
        const past = (gn?.history || []).slice(0, -1)
        if (past.length) {
          const cards = past
            .slice()
            .reverse()
            .map((h) => {
              const st = h.status === 'done' ? '✓' : h.status === 'error' ? '✗' : '…'
              const stColor =
                h.status === 'done' ? '#7ab97a' : h.status === 'error' ? '#e07070' : '#aaa'
              const thumb = h.imageFile
                ? `<img class="reel-thumb" src="/img/${pid}/${h.imageFile}?r=${h.rev}" data-full="/img/${pid}/${h.imageFile}"` +
                  ` data-cap="장지 rev ${h.rev} · ${h.startedAt ? h.startedAt.slice(0, 16).replace('T', ' ') : ''}${h.error ? ` · ${String(h.error).slice(0, 80)}` : ''}"` +
                  ` style="width:160px;height:40px;object-fit:cover;border-radius:3px;cursor:zoom-in;display:block" loading="lazy">`
                : `<span style="width:160px;height:40px;display:flex;align-items:center;justify-content:center;background:#2a2a2a;border-radius:3px;color:#777;font-size:11px">이미지 없음</span>`
              return (
                `<span style="display:inline-flex;flex-direction:column;gap:2px;flex:none">` +
                thumb +
                `<span style="font-size:11px;opacity:.8"><span style="color:${stColor}">${st}</span> r${h.rev} · ${h.startedAt ? h.startedAt.slice(5, 16).replace('T', ' ') : '?'}` +
                (h.videoFile
                  ? ` <a href="/media/${pid}/${h.videoFile}" target="_blank" style="color:#7ab">▶</a>`
                  : '') +
                `</span></span>`
              )
            })
            .join('')
          history =
            `<div class="video-row" style="font-size:12px;flex-direction:column;align-items:stretch;gap:4px">` +
            `<span data-act="grave-hist-toggle" style="cursor:pointer;user-select:none;opacity:.85">${graveHistOpen ? '▾' : '▸'} 지난 히스토리 ${past.length}건 (rev ${past[0].rev}~${past[past.length - 1].rev})</span>` +
            (graveHistOpen
              ? `<div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px">${cards}</div>`
              : '') +
            `</div>`
        }

        return (
          `<section class="video-panel"><div class="video-head"><h2>Grave Panorama — 장지 (안식처, 1차 전용)</h2></div>` +
          `<div class="video-row">${row}</div>${settingRow}${preview}${history}</section>`
        )
      }
      // #reel-slot 안만 갱신 — 진행률 폴링이 장면 그리드를 건드리지 않게.
      function mountVideo() {
        const slot = $('#reel-slot')
        if (slot)
          slot.innerHTML =
            renderVideo() + FUNERAL_VARIANTS.map((v) => renderFuneral(v)).join('') + renderGrave()
      }
      async function postVideo(path, okMsg, failMsg, body = {}) {
        try {
          await api(path, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          })
          setStatus(okMsg)
          mountVideo()
        } catch (e) {
          setStatus(`${failMsg}: ${e.message}`)
        }
      }
      const genClips = () =>
        postVideo(
          `/api/personas/${pid}/clips`,
          '영상 클립 생성 시작 — 진행은 영상 패널에 표시 (장당 ~1분, 30장이면 수십 분)',
          '영상 생성 실패'
        )
      const buildReel = () =>
        postVideo(
          `/api/personas/${pid}/reel`,
          '릴 합성 시작 — Firebase 클립(없으면 로컬)으로 90초 합성',
          '릴 합성 실패'
        )
      const resumeClips = () =>
        postVideo(
          `/api/personas/${pid}/resume-clips`,
          '이어서 생성 시작 — Firebase 저장분을 회수하고 부족한 장면만 생성해 재업로드',
          '이어서 생성 실패'
        )
      const pauseVideo = () =>
        postVideo(
          '/api/video/stop',
          '일시정지 요청 — 현재 클립까지 마치고 멈춥니다 (이어서 생성 가능)',
          '일시정지 실패',
          { kind: 'pause' }
        )
      const stopVideo = () =>
        postVideo(
          '/api/video/stop',
          '중단 요청 — 현재 클립까지 마치고 멈춥니다 (만든 클립은 유지)',
          '중단 실패',
          { kind: 'stop' }
        )
      // 이미지 생성 취소 — postVideo와 달리 mountVideo 대신 큐만 갱신한다.
      async function postGen(path, okMsg, failMsg, body = {}) {
        try {
          await api(path, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          })
          setStatus(okMsg)
          pollQueue()
        } catch (e) {
          setStatus(`${failMsg}: ${e.message}`)
        }
      }
      const pauseGen = () =>
        postGen(
          '/api/stop',
          '일시정지 요청 — 현재 장면까지 마치고 멈춥니다 (재개하면 같은 항목을 이어서)',
          '일시정지 실패',
          { kind: 'pause' }
        )
      const stopGen = () =>
        postGen(
          '/api/stop',
          '중지 요청 — 이 항목을 세워두고 다음 대기 항목으로 넘어갑니다 (진행분은 저장·재개 가능)',
          '중지 실패',
          { kind: 'stop' }
        )
      // 전체 재생성 — 선택 persona의 전 장면을 현재 프롬프트로 다시 생성(백그라운드). 진행률은 헤더에.
      async function regenAll() {
        if (!pid) return
        const n = manifest?.images?.length || 0
        if (!n) {
          setStatus('재생성할 장면이 없습니다')
          return
        }
        if (
          !confirm(
            `${manifest?.name || pid}의 전 장면(${n}장)을 현재 프롬프트로 다시 생성합니다.\n장당 ~15초 (총 수 분 소요). 진행할까요?`
          )
        )
          return
        try {
          await api(`/api/personas/${pid}/regen-all`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: '{}'
          })
          setStatus('전체 재생성 시작 — 진행률은 상단에 표시됩니다')
          lastRegenDone = -1
          pollQueue()
        } catch (e) {
          setStatus(`전체 재생성 실패: ${e.message}`)
        }
      }
      const stopRegenAll = () =>
        postGen(
          '/api/regen-all/stop',
          '전체 재생성 중지 요청 — 현재 장면까지 마치고 멈춥니다',
          '중지 실패'
        )
      // 릴 사진(3:4 필름스트립) 생성/재생성 — 백그라운드 잡. force=전체 새로(완료 상태에서 재생성).
      async function genReelPhotos(force, variant = 'past') {
        if (!pid) return
        const L = variant === 'future' ? '미래 릴' : '과거 릴'
        if (
          force &&
          !confirm(
            `${manifest?.profile?.name || pid}의 ${L} 사진 12장을 전부 새로 생성합니다. 진행할까요?`
          )
        )
          return
        try {
          await api(`/api/personas/${pid}/reel-photos`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ force: Boolean(force), variant })
          })
          setStatus(`${L} 대기열 등록 — 앞선 생성이 끝나는 대로 순차 실행됩니다 (진행은 영상 패널)`)
          lastReelPhotoDone = -1
          pollQueue()
        } catch (e) {
          setStatus(`${L} 생성 실패: ${e.message}`)
        }
      }
      const stopReelPhotos = () =>
        postGen(
          '/api/reel-photos/stop',
          '릴 사진 생성 중지 요청 — 진행분은 저장되어 재실행 시 이어집니다',
          '중지 실패'
        )
      // 분기 미래(3차) 일괄 생성 시작 — 유령 대화 기록 기반(startBranchedFuture). 대기열이 아니라
      // 메인 생성 잠금(current)을 쓰므로 다른 생성이 돌고 있으면 서버가 400으로 거부한다.
      async function genBranched(btn) {
        if (!pid) return
        if (
          (manifest?.reelPhotosBranched || []).length &&
          !confirm(
            `${manifest?.profile?.name || pid}의 분기 미래(alt 파노라마·분기 릴·분기 장례식)를 다시 생성합니다. 진행할까요?`
          )
        )
          return
        btn.disabled = true
        try {
          await api(`/api/personas/${pid}/branched`, { method: 'POST' })
          setStatus('분기 미래(3차) 생성 시작 — 완료되면 2차 체험 세션 버튼이 열립니다')
          pollQueue()
        } catch (e) {
          setStatus(`분기 미래 생성 실패: ${e.message}`)
          btn.disabled = false
        }
      }
      // 장례식(고인 시선 파노라마 + Wan 영상) 생성/재생성 — 대기열 잡. force=완료 상태에서 새 rev.
      async function genFuneral(force, variant = 'present') {
        if (!pid) return
        const L = funeralLabel(variant)
        if (
          force &&
          !confirm(
            `${manifest?.profile?.name || pid}의 ${L} 이미지를 새 rev로 다시 생성합니다.\n기존 rev는 히스토리에 남고, 새 이미지는 다시 승인해야 영상화됩니다. 진행할까요?`
          )
        )
          return
        try {
          await api(`/api/personas/${pid}/funeral`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ force: Boolean(force), variant })
          })
          setStatus(`${L} 이미지 생성 대기열 등록 — 완료되면 패널에 떠서 검토·승인할 수 있습니다`)
          pollQueue()
        } catch (e) {
          setStatus(`${L} 생성 실패: ${e.message}`)
        }
      }
      const stopFuneral = () =>
        postGen(
          '/api/funeral/stop',
          '장례식 생성 중지 요청 — 진행분은 저장되어 재실행 시 이어집니다',
          '중지 실패'
        )
      // 승인 — 검토된 이미지를 영상화 가능 상태로. 승인해야만 영상화 버튼이 동작한다.
      async function approveFuneral(variant = 'present') {
        if (!pid) return
        try {
          const r = await api(`/api/personas/${pid}/funeral/approve`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ variant })
          })
          setStatus(
            `${funeralLabel(variant)} 이미지 승인 완료 (rev ${r.rev}) — 이제 영상화를 시작할 수 있습니다`
          )
          await loadManifest().catch(() => {})
        } catch (e) {
          setStatus(`승인 실패: ${e.message}`)
        }
      }
      // 영상화 — 승인된 이미지를 Wan2.2로 (대기열 등록, 진행은 패널에 표시).
      // force=완료 상태에서 영상만 재생성(같은 rev·승인 유지, 이전 영상은 videoHistory로).
      async function videoFuneral(force, variant = 'present') {
        if (!pid) return
        try {
          await api(`/api/personas/${pid}/funeral/video`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ force: !!force, variant })
          })
          setStatus(
            `${funeralLabel(variant)} 영상화 대기열 등록 — Wan2.2 생성이 시작됩니다 (수 분 소요)`
          )
          pollQueue()
        } catch (e) {
          setStatus(`영상화 실패: ${e.message}`)
        }
      }
      // Firebase 저장 — 완료된 이미지+영상을 Storage와 'generatedFunerals' 컬렉션에 업로드.
      async function uploadFuneral(btn, variant = 'present') {
        if (!pid) return
        if (btn) {
          btn.disabled = true
          btn.textContent = 'Firebase 저장 중…'
        }
        try {
          const r = await api(`/api/personas/${pid}/funeral/upload`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ variant })
          })
          setStatus(`${funeralLabel(variant)} Firebase 저장 완료 (rev ${r.rev})`)
          await loadManifest().catch(() => {})
        } catch (e) {
          setStatus(`Firebase 저장 실패: ${e.message}`)
          mountVideo()
        }
      }
      // ── 장지(안식처) — 장례식과 같은 4단계 핸들러(variant 없음) ──
      async function genGrave(force) {
        if (!pid) return
        if (
          force &&
          !confirm(
            `${manifest?.profile?.name || pid}의 장지 이미지를 새 rev로 다시 생성합니다.\n기존 rev는 히스토리에 남고, 새 이미지는 다시 승인해야 영상화됩니다. 진행할까요?`
          )
        )
          return
        try {
          await api(`/api/personas/${pid}/grave`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ force: Boolean(force) })
          })
          setStatus('장지 이미지 생성 대기열 등록 — 완료되면 패널에 떠서 검토·승인할 수 있습니다')
          pollQueue()
        } catch (e) {
          setStatus(`장지 생성 실패: ${e.message}`)
        }
      }
      const stopGrave = () =>
        postGen(
          '/api/grave/stop',
          '장지 생성 중지 요청 — 진행분은 저장되어 재실행 시 이어집니다',
          '중지 실패'
        )
      async function approveGrave() {
        if (!pid) return
        try {
          const r = await api(`/api/personas/${pid}/grave/approve`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({})
          })
          setStatus(`장지 이미지 승인 완료 (rev ${r.rev}) — 이제 영상화를 시작할 수 있습니다`)
          await loadManifest().catch(() => {})
        } catch (e) {
          setStatus(`승인 실패: ${e.message}`)
        }
      }
      async function videoGrave(force) {
        if (!pid) return
        try {
          await api(`/api/personas/${pid}/grave/video`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ force: !!force })
          })
          setStatus('장지 영상화 대기열 등록 — Wan2.2 생성이 시작됩니다 (수 분 소요)')
          pollQueue()
        } catch (e) {
          setStatus(`영상화 실패: ${e.message}`)
        }
      }
      async function uploadGrave(btn) {
        if (!pid) return
        if (btn) {
          btn.disabled = true
          btn.textContent = 'Firebase 저장 중…'
        }
        try {
          const r = await api(`/api/personas/${pid}/grave/upload`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({})
          })
          setStatus(`장지 Firebase 저장 완료 (rev ${r.rev})`)
          await loadManifest().catch(() => {})
        } catch (e) {
          setStatus(`Firebase 저장 실패: ${e.message}`)
          mountVideo()
        }
      }
      // '중지'로 세워둔 항목을 다시 생성(남은 장면부터 이어서).
      async function resumeProfile(id, btn) {
        if (btn) {
          btn.disabled = true
          btn.textContent = '재개 중…'
        }
        try {
          await api('/api/resume', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id })
          })
          setStatus(`재개 요청: ${id} — 남은 장면부터 이어서 생성`)
        } catch (e) {
          setStatus(`재개 실패: ${e.message}`)
          if (btn) {
            btn.disabled = false
            btn.textContent = '재개'
          }
        }
      }
      async function retryProfile(id, btn) {
        if (btn) {
          btn.disabled = true
          btn.textContent = '재실행 중…'
        }
        try {
          await api('/api/retry', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id })
          })
          setStatus(`재실행 요청: ${id} — 다시 생성 대기열로`)
        } catch (e) {
          setStatus(`재실행 실패: ${e.message}`)
        }
      }
      // 인생그래프 세션은 자동 생성이 없다 — 이 버튼이 유일한 시작 지점(/api/lifegraph/generate).
      async function startLifeGraph(id, btn) {
        if (btn) {
          btn.disabled = true
          btn.textContent = '시작 중…'
        }
        try {
          await api('/api/lifegraph/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id })
          })
          setStatus(`생성 시작: ${id}`)
        } catch (e) {
          setStatus(`생성 시작 실패: ${e.message}`)
          if (btn) {
            btn.disabled = false
            btn.textContent = '생성'
          }
        }
      }
      // 큐에서 줄 삭제 — 인생그래프 세션 줄(id에 '#')이면 그 세션만, 아니면 프로필 문서째.
      // 이미 만들어진 생성물은 지우지 않는다(제출 큐 정리 전용).
      async function deleteQueueItem(id, name, btn) {
        const isSession = id.includes('#')
        if (
          !confirm(
            `${name || id}\n\n${
              isSession
                ? '이 제출 세션을 큐에서 삭제합니다 (같은 사람의 다른 세션은 남습니다).'
                : '이 참가자의 제출 문서를 삭제합니다.'
            }\n이미 생성된 이미지·영상은 그대로 남습니다. 되돌릴 수 없습니다. 진행할까요?`
          )
        )
          return
        if (btn) {
          btn.disabled = true
          btn.textContent = '삭제 중…'
        }
        try {
          const r = await api('/api/queue/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id })
          })
          setStatus(r.deleted ? `삭제됨: ${name || id}` : `이미 없는 항목입니다: ${name || id}`)
          pollQueue()
        } catch (e) {
          setStatus(`삭제 실패: ${e.message}`)
          if (btn) {
            btn.disabled = false
            btn.textContent = '삭제'
          }
        }
      }

      // 재렌더되는 버튼들 — 이벤트 위임
      document.addEventListener('click', (e) => {
        const t = e.target
        if (!t) return
        if (t.id === 'reel-build') buildReel()
        else if (t.classList.contains('reel-thumb')) {
          // 릴 사진 썸네일 클릭 → 기존 zoom 오버레이로 크게 보기(장면 카드와 동일 UX).
          $('#zoom img').src = t.dataset.full + '?t=' + Date.now() // 재생성 직후 캐시 회피
          $('#zoom .cap').textContent = t.dataset.cap || ''
          $('#zoom').classList.add('show')
        } else if (t.dataset.act === 'reel-photos-gen')
          genReelPhotos(t.dataset.force === '1', t.dataset.variant || 'past')
        else if (t.dataset.act === 'reel-photos-stop') stopReelPhotos()
        else if (t.dataset.act === 'branched-gen') genBranched(t)
        else if (t.dataset.act === 'branched-stop') stopGen()
        // 장례식은 두 판이 같이 떠 있어 id 대신 data-act + data-variant로 갈린다.
        else if (t.dataset.act === 'funeral-hist-toggle') {
          const v = t.dataset.variant || 'present'
          funeralHistOpen[v] = !funeralHistOpen[v]
          mountVideo()
        } else if (t.dataset.act === 'funeral-cast-toggle') {
          const v = t.dataset.variant || 'present'
          funeralCastOpen[v] = !funeralCastOpen[v]
          mountVideo()
        } else if (t.dataset.act === 'funeral-gen')
          genFuneral(t.dataset.force === '1', t.dataset.variant || 'present')
        else if (t.dataset.act === 'funeral-approve') approveFuneral(t.dataset.variant || 'present')
        else if (t.dataset.act === 'funeral-video')
          videoFuneral(t.dataset.force === '1', t.dataset.variant || 'present')
        else if (t.dataset.act === 'funeral-upload')
          uploadFuneral(t, t.dataset.variant || 'present')
        else if (t.dataset.act === 'funeral-stop') stopFuneral()
        else if (t.dataset.act === 'grave-hist-toggle') {
          graveHistOpen = !graveHistOpen
          mountVideo()
        } else if (t.dataset.act === 'grave-gen') genGrave(t.dataset.force === '1')
        else if (t.dataset.act === 'grave-approve') approveGrave()
        else if (t.dataset.act === 'grave-video') videoGrave(t.dataset.force === '1')
        else if (t.dataset.act === 'grave-upload') uploadGrave(t)
        else if (t.dataset.act === 'grave-stop') stopGrave()
        else if (t.id === 'video-resume') resumeClips()
        else if (t.id === 'video-genclips') genClips()
        else if (t.id === 'video-pause') pauseVideo()
        else if (t.id === 'video-stop') stopVideo()
        else if (t.id === 'gen-pause') pauseGen()
        else if (t.id === 'gen-stop') stopGen()
        else if (t.id === 'regen-all') regenAll()
        else if (t.id === 'regenall-stop') stopRegenAll()
        else if (t.classList.contains('retry-btn')) retryProfile(t.dataset.id, t)
        else if (t.classList.contains('resume-btn')) resumeProfile(t.dataset.id, t)
        else if (t.classList.contains('gen-btn')) startLifeGraph(t.dataset.id, t)
        else if (t.classList.contains('del-btn')) deleteQueueItem(t.dataset.id, t.dataset.name, t)
      })

      // 사이드바에서 persona 선택 (이벤트 위임)
      $('#persona-list').addEventListener('click', (e) => {
        const item = e.target.closest('.pitem')
        if (!item || item.dataset.pid === pid) return
        pid = item.dataset.pid
        sceneTab = 'main' // 참가자가 바뀌면 운명적 탭부터
        funeralHistOpen = { present: false, future: false } // 페르소나가 바뀌면 장례식 접이 상태 초기화
        funeralCastOpen = { present: false, future: false }
        graveHistOpen = false
        renderPersonaList() // 강조 즉시 이동
        if (item.dataset.ready === '0') {
          // 아직 생성 전 — 리뷰할 게 없다. 상태만 안내하고 manifest는 로딩하지 않는다.
          const p = personas.find((x) => x.personaId === pid)
          $('#cur-name').textContent = p?.name || pid
          $('#main').innerHTML =
            `<p style="color:#c9a86a">아직 생성 전인 제출입니다 (${pendingLabel(p).text}). 생성이 끝나면 여기서 리뷰할 수 있습니다.</p>`
          return
        }
        loadManifest() // 클라우드 정본만 있으면 서버가 자동으로 받아온다(hydrate)
      })
      $('#persona-search').addEventListener('input', (e) => {
        personaFilter = e.target.value
        renderPersonaList()
      })
      $('#gender').addEventListener('change', async (e) => {
        if (!pid || !manifest) return
        try {
          const out = await api(`/api/personas/${pid}/gender`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ gender: e.target.value || null })
          })
          setStatus(out.note)
          await loadManifest()
        } catch (err) {
          setStatus(`성별 수정 실패: ${err.message}`)
          renderGender() // 실패 시 원래 값으로 되돌림
        }
      })
      // 세션 참가자 지정 — 지금 보고 있는 참가자를 4창 런타임 세션으로 설정.
      // experience: 'first'=1차 체험(과거 회귀 주마등) | 'second'=2차 체험(분기 미래 릴·장례식).
      async function setSession(experience) {
        if (!pid) return
        try {
          const sel = await api('/api/session', {
            method: 'POST',
