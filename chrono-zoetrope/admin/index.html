            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ personaId: pid, experience })
          })
          sessionPid = sel.personaId
          sessionExp = sel.experience === 'second' ? 'second' : 'first'
          setStatus(
            `세션 참가자 → ${sel.name || sel.personaId} · ${sessionExp === 'second' ? '2차 체험(분기 미래)' : '1차 체험'} (런타임이 IDLE이면 즉시 반영)`
          )
          renderSessionCtl()
          renderPersonaList()
        } catch (e) {
          setStatus(`세션 설정 실패: ${e.message}`)
        }
      }
      $('#session-set').addEventListener('click', () => setSession('first'))
      $('#session-set2').addEventListener('click', () => setSession('second'))
      // 세션 나가기 — 현재 선택 해제. 런타임은 대기(IDLE)로 복귀.
      $('#session-clear').addEventListener('click', async () => {
        try {
          await api('/api/session', { method: 'DELETE' })
          sessionPid = null
          sessionExp = 'first'
          setStatus('세션 나가기 — 선택 해제 (런타임이 IDLE이면 대기로 복귀)')
          renderSessionCtl()
          renderPersonaList()
        } catch (e) {
          setStatus(`세션 나가기 실패: ${e.message}`)
        }
      })
      $('#zoom').addEventListener('click', () => $('#zoom').classList.remove('show'))
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') $('#zoom').classList.remove('show')
      })

      // ── 생성 큐 (collector 제출 → admin 자동 생성) ────────────────────
      let autoOn = true
      let lastCompletionAt = 0
      let liveSig = '' // 실시간 보기: 마지막으로 그린 manifest의 장면 수 — 바뀔 때만 재렌더
      const QLABEL = { submitted: '대기', generating: '생성중', error: '실패', stopped: '정지됨' }

      async function pollQueue() {
        let data
        try {
          data = await api('/api/queue')
        } catch {
          return
        }

        // 영상 상태 반영 (Firebase 무관 — 수동 작업도 진행 표시). 완료 감지 시 manifest 재로딩.
        videoState = data.video || null
        if (videoState) {
          const b = videoState.building
          const relevant =
            pid && ((b && b.pid === pid) || (videoState.queue || []).some((v) => v.pid === pid))
          if (relevant) mountVideo()
          const vl = videoState.last
          if (vl && vl.at > lastVideoAt) {
            lastVideoAt = vl.at
            if (vl.ok && vl.pid === pid)
              loadManifest().catch(() => {}) // 클립 완료→_clipStatus 갱신, 릴 완료→플레이어
            else mountVideo()
            const label =
              vl.kind === 'reel' ? '릴' : vl.kind === 'resume' ? '이어서 생성' : '영상 클립'
            setStatus(
              vl.cancelled
                ? `${label} ${vl.pauseKind === 'pause' ? '일시정지' : '중단'}됨: ${vl.pid}`
                : vl.ok
                  ? `${label} 완료: ${vl.pid}${vl.durationSec ? ` (${vl.durationSec.toFixed(1)}초)` : ''}` +
                    (vl.firebaseWarn ? ` · ⚠ ${vl.firebaseWarn}` : '')
                  : `${label} 실패: ${vl.error}`
            )
          }
        }

        // 릴 사진 잡·대기열 진행/완료 반영 — 진행 중이면 done이 바뀔 때마다 썸네일(manifest) 재로딩,
        // 잡/대기열 구성이 바뀌면(내 것이 아니어도 — 대기 순번 표시) 영상 패널만 재렌더.
        reelPhotoState = data.reelPhotos || null
        const rpj = reelPhotoState?.job || null
        const rpSig = JSON.stringify([
          rpj?.pid,
          rpj?.variant,
          rpj?.done,
          (reelPhotoState?.queue || []).map((q) => `${q.pid}:${q.variant || 'past'}`)
        ])
        if (rpj && rpj.pid === pid && rpj.done !== lastReelPhotoDone) {
          lastReelPhotoDone = rpj.done
          loadManifest().catch(() => {})
        } else if (rpSig !== lastReelPhotoSig) {
          mountVideo()
        }
        lastReelPhotoSig = rpSig
        const rpl = reelPhotoState?.last
        if (rpl && rpl.at > lastReelPhotoAt) {
          lastReelPhotoAt = rpl.at
          if (rpl.pid === pid) loadManifest().catch(() => {})
          else mountVideo()
          const rpL = (rpl.variant || 'past') === 'future' ? '미래 릴' : '과거 릴'
          setStatus(
            rpl.error
              ? `${rpL} 사진 생성 실패: ${rpl.error} (${rpl.name || rpl.pid})`
              : rpl.cancelled
                ? `${rpL} 사진 생성 중지: ${rpl.ok}장까지 (${rpl.name || rpl.pid})`
                : `${rpL} 사진 생성 완료: 성공 ${rpl.ok}, 실패 ${rpl.err} (${rpl.name || rpl.pid})`
          )
        }

        // 분기 미래(3차) 잡 — 메인 생성 잠금을 공유하며 current가 '#branched'로 끝난다.
        // 진행 중엔 done이 바뀔 때만 재렌더, 내 참가자의 잡이 끝나면 manifest 재로딩
        // (reelPhotosBranched 반영 → 분기 릴 카운트·'2차 체험 세션' 버튼 게이트 갱신).
        const bj =
          typeof data.current === 'string' && data.current.endsWith('#branched')
            ? data.currentInfo
            : null
        const bSig = JSON.stringify([bj?.pid, bj?.done])
        if (bSig !== lastBranchedSig) {
          const finishedMine =
            !bj && branchedJob && (branchedJob.pid === pid || branchedJob.personaId === pid)
          branchedJob = bj
          lastBranchedSig = bSig
          if (finishedMine) loadManifest().catch(() => {})
          else mountVideo()
        }

        // 장례식 잡·대기열 진행/완료 반영 — 단계(phase)가 바뀌거나 대기열 구성이 바뀌면 패널 재렌더,
        // 잡 완료 시 manifest 재로딩(최신 rev 이미지·영상·히스토리 표시).
        funeralState = data.funeral || null
        const fj = funeralState?.job || null
        const fSig = JSON.stringify([
          fj?.pid,
          fj?.variant,
          fj?.phase,
          (funeralState?.queue || []).map((q) => `${q.pid}:${q.variant || 'present'}`)
        ])
        if (fSig !== lastFuneralSig) {
          lastFuneralSig = fSig
          mountVideo()
        }
        const fl = funeralState?.last
        if (fl && fl.at > lastFuneralAt) {
          lastFuneralAt = fl.at
          if (fl.pid === pid) loadManifest().catch(() => {})
          else mountVideo()
          const fWhat = fl.stage === 'video' ? '영상화' : '이미지 생성'
          const fL = funeralLabel(fl.variant || 'present')
          setStatus(
            fl.error
              ? `${fL} ${fWhat} 실패: ${fl.error} (${fl.name || fl.pid})`
              : fl.cancelled
                ? `${fL} ${fWhat} 중지됨 (${fl.name || fl.pid} — 재실행으로 이어짐)`
                : fl.stage === 'video'
                  ? `${fL} 영상화 완료: rev ${fl.rev} (${fl.name || fl.pid}) — Firebase 저장 버튼을 누르세요`
                  : `${fL} 이미지 완료: rev ${fl.rev} (${fl.name || fl.pid}) — 검토 후 승인하세요`
          )
        }

        // 장지 잡·대기열 진행/완료 반영 — 장례식과 동일한 시그니처 방식.
        graveState = data.grave || null
        const gj2 = graveState?.job || null
        const gSig = JSON.stringify([
          gj2?.pid,
          gj2?.phase,
          (graveState?.queue || []).map((q) => q.pid)
        ])
        if (gSig !== lastGraveSig) {
          lastGraveSig = gSig
          mountVideo()
        }
        const gl = graveState?.last
        if (gl && gl.at > lastGraveAt) {
          lastGraveAt = gl.at
          if (gl.pid === pid) loadManifest().catch(() => {})
          else mountVideo()
          const gWhat = gl.stage === 'video' ? '영상화' : '이미지 생성'
          setStatus(
            gl.error
              ? `장지 ${gWhat} 실패: ${gl.error} (${gl.name || gl.pid})`
              : gl.cancelled
                ? `장지 ${gWhat} 중지됨 (${gl.name || gl.pid} — 재실행으로 이어짐)`
                : gl.stage === 'video'
                  ? `장지 영상화 완료: rev ${gl.rev} (${gl.name || gl.pid}) — Firebase 저장 버튼을 누르세요`
                  : `장지 이미지 완료: rev ${gl.rev} (${gl.name || gl.pid}) — 검토 후 승인하세요`
          )
        }

        // 전체 재생성 진행/완료 반영
        const rj = data.regenAll?.job || null
        const rbtn = $('#regen-all')
        const rstat = $('#regenall-status')
        if (rbtn && rstat) {
          if (rj) {
            const mine = rj.pid === pid
            rbtn.disabled = true
            rstat.innerHTML =
              `전체 재생성 ${rj.done}/${rj.total}${mine ? '' : ` · ${rj.name}`} ` +
              `<button id="regenall-stop" class="stop-btn">중지</button>`
            // 내가 보고 있는 persona면 새로 나온 장면이 반영되게 done이 바뀔 때마다 그리드 재로딩.
            if (mine && rj.done !== lastRegenDone) {
              lastRegenDone = rj.done
              loadManifest().catch(() => {})
            }
          } else {
            rbtn.disabled = data.viewOnly || !pid
            rstat.textContent = ''
            lastRegenDone = -1
          }
        }
        const rl = data.regenAll?.last
        if (rl && rl.at > lastRegenAt) {
          lastRegenAt = rl.at
          if (rl.pid === pid) loadManifest().catch(() => {})
          setStatus(
            rl.cancelled
              ? `전체 재생성 중지: ${rl.done}/${rl.total} (${rl.name || rl.pid})`
              : `전체 재생성 완료: 성공 ${rl.ok}, 실패 ${rl.err} (${rl.name || rl.pid})`
          )
        }

        const panel = $('#queue-panel')
        // Firebase 미연결이면 큐 패널 숨김 (검토 기능만 사용)
        if (!data.firebaseReady) {
          panel.classList.add('hidden')
          return
        }
        panel.classList.remove('hidden')

        autoOn = data.autoOn
        const tgl = $('#auto-toggle')
        if (data.viewOnly) {
          // 뷰어 모드: 생성은 별도 워커(worker:listen) 담당 — 토글 비활성.
          tgl.textContent = '뷰어 모드'
          tgl.className = 'off'
          tgl.disabled = true
          tgl.title = '생성은 워커 프로세스가 담당합니다 (npm run worker:listen)'
        } else {
          tgl.textContent = autoOn ? '자동생성 ON' : '일시정지됨'
          tgl.className = autoOn ? 'on' : 'off'
          tgl.disabled = false
        }

        const now = $('#queue-now')
        const ci = data.currentInfo
        if (ci) {
          const prog = ci.total ? ` — 장면 ${ci.done}/${ci.total}` : ''
          const watching = ci.personaId && pid === ci.personaId
          now.innerHTML =
            `생성 중 <b>${ci.name || ci.pid}</b>${prog}` +
            (watching ? '' : ci.personaId ? ` <button id="follow-live">실시간 보기</button>` : '') +
            (data.viewOnly
              ? ''
              : ` <button id="gen-pause" class="stop-btn">일시정지</button> <button id="gen-stop" class="stop-btn">중지</button>`)
          const fl = $('#follow-live')
          if (fl)
            fl.onclick = async () => {
              pid = ci.personaId
              renderPersonaList()
              liveSig = ''
              await loadManifest().catch(() =>
                setStatus('아직 첫 장 생성 전입니다 — 곧 나타납니다.')
              )
            }
          // 일시정지·중지 버튼은 아래 이벤트 위임(document click)에서 처리한다.
        } else {
          now.textContent = data.queue.some((q) => q.status === 'submitted') ? '대기 중…' : '유휴'
        }

        // 실시간 보기: 생성 중인 persona를 보고 있으면 새 장이 저장될 때마다 그리드 갱신.
        // manifest는 장마다 즉시 기록되므로(life-library의 중단 대비 writeManifest)
        // 폴링 주기(2초) 안에 새 포트레이트/장면이 바로 떠오른다.
        if (ci?.personaId && pid === ci.personaId) {
          api(`/api/personas/${pid}`)
            .then((m) => {
              const sig = `${m.images?.length || 0}`
              if (sig !== liveSig) {
                liveSig = sig
                manifest = m
                // 첫 장면 전(_pending·빈 목록)이면 대기 안내만, 장면이 생기면 그때부터 그린다.
                if (m._pending || !m.images?.length)
                  $('#main').innerHTML =
                    '<p style="color:#888">아직 첫 장면 생성 전입니다 — 곧 나타납니다…</p>'
                else render()
              }
            })
            .catch(() => {}) // 생성 극초반엔 manifest가 아직 없다 — 다음 폴링에서 재시도
          // 새 persona가 목록에 아직 없으면 흡수 (검토 중인 선택은 유지)
          if (!personas.some((p) => p.personaId === ci.personaId))
            loadPersonas({ keep: true }).catch(() => {})
        }

        const list = $('#queue-list')
        if (data.queue.length === 0) {
          list.innerHTML = '<span class="qempty">큐가 비어 있습니다.</span>'
        } else {
          list.innerHTML = data.queue
            .map(
              (q) =>
                `<div class="qitem" title="${q.error ? q.error.replaceAll('"', '&quot;') : q.id}">` +
                `<span class="qid">${q.name || q.id}</span>` +
                `<span class="badge ${q.status}">${QLABEL[q.status] || q.status}</span>` +
                (q.status === 'error' && !data.viewOnly
                  ? `<button class="retry-btn" data-id="${q.id}">재실행</button>`
                  : '') +
                // 중지로 세워둔 항목 — 남은 장면부터 이어서 생성.
                (q.status === 'stopped' && !data.viewOnly
                  ? `<button class="resume-btn" data-id="${q.id}">재개</button>`
                  : '') +
                // 인생그래프 세션은 자동 생성이 없다 — "대기" 상태에 이 버튼이 유일한 시작 지점.
                (q.kind === 'lifegraph' && q.status === 'submitted' && !data.viewOnly
                  ? `<button class="gen-btn" data-id="${q.id}">생성</button>`
                  : '') +
                // 큐에서 지우기 — 생성 중인 줄은 먼저 중지해야 하므로 버튼을 붙이지 않는다.
                (q.status !== 'generating' && !data.viewOnly
                  ? `<button class="del-btn" data-id="${q.id}" data-name="${(q.name || q.id).replaceAll('"', '&quot;')}">삭제</button>`
                  : '') +
                `</div>`
            )
            .join('')
        }

        // 새 완료 감지 → 검토 목록만 갱신(선택 유지). 새 persona가 셀렉터에 등장한다.
        if (data.lastResult && data.lastResult.ok && data.lastResult.at > lastCompletionAt) {
          lastCompletionAt = data.lastResult.at
          loadPersonas({ keep: true }).catch(() => {})
        }
      }

      $('#auto-toggle').addEventListener('click', async () => {
        try {
          const r = await api('/api/autogen', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ on: !autoOn })
          })
          autoOn = r.autoOn
          pollQueue()
        } catch (e) {
          setStatus(`자동생성 토글 실패: ${e.message}`)
        }
      })

      loadPersonas().then(loadSession)
      pollQueue()
      setInterval(pollQueue, 2000)
    </script>
  </body>
</html>
